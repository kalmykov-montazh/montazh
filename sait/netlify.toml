# Сайт kalmykov-realty: Netlify берёт эту папку (Base directory = sait)
# и собирает только когда изменилось что-то внутри sait/, остальные коммиты робота пропускает
[build]
  publish = "."
  command = ""
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

# 13.11.2026: сайт переехал на свой домен kalmykovgroup.com (Cloudflare Pages).
# Старый адрес kalmykov-realty.netlify.app навсегда (301) ведёт на ту же страницу нового.
[[redirects]]
  from = "/*"
  to = "https://kalmykovgroup.com/:splat"
  status = 301
  force = true
