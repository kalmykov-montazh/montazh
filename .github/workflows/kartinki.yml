name: Забрать картинки для проверки

# Для Claude: кадры.jpg и обложки роликов с Диска уменьшенными копиями в архив задачи (artifact),
# зашифрованным архивом в ветку tmp-pics (архивы задач через прокси Claude не скачиваются).
# После просмотра Claude удаляет ветку.

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Папка в «Готовые!» с роликами, например Готовые!/Шортсы Год в Испании"
        required: true
      key:
        description: "Пароль для шифрования архива (картинки уходят зашифрованными в ветку tmp-pics)"
        required: true
      work_prefix:
        description: "Начало ключа в «работа/», например «Шортсы Год в Испании - »"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  pics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rclone
        with:
          token: ${{ secrets.RCLONE_TOKEN }}
          client_id: ${{ secrets.RCLONE_CLIENT_ID }}
          client_secret: ${{ secrets.RCLONE_CLIENT_SECRET }}
      - name: Скачать и уменьшить
        env:
          F: ${{ inputs.folder }}
          WP: ${{ inputs.work_prefix }}
        run: |
          mkdir -p src out
          rclone copy "montazh:$F" src --include "*/обложка.jpg"
          for d in src/*/; do
            n=$(basename "$d")
            rclone copyto "montazh:работа/${WP}${n}/кадры.jpg" "src/$n/кадры.jpg" 2>/dev/null || true
          done
          pip install -q pillow
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          for f in glob.glob('src/*/*.jpg'):
              n = os.path.basename(os.path.dirname(f)); b = os.path.splitext(os.path.basename(f))[0]
              im = Image.open(f).convert('RGB'); im.thumbnail((900, 900))
              im.save(f'out/{n} - {b}.jpg', quality=80)
          PY
          echo "::notice::Картинок: $(ls out | wc -l)"
      - name: Зашифровать и положить в ветку tmp-pics
        env:
          KEY: ${{ inputs.key }}
        run: |
          echo "::add-mask::$KEY"
          tar czf p.tgz -C out .
          openssl enc -aes-256-cbc -pbkdf2 -salt -in p.tgz -out /tmp/p.enc -pass env:KEY
          git config user.name montazh; git config user.email montazh@users.noreply.github.com
          git checkout --orphan tmp-pics; git rm -rqf .
          cp /tmp/p.enc p.enc; git add p.enc; git commit -qm "tmp [skip ci]"; git push -fq origin tmp-pics
