name: Вырезать куски из исходника вне «Монтаж!» (для перенарезки шортсов)

# 29.10.2026: «Год в Испании», «Соцсети». Исходник 4K 60 к/с 13–16 ГБ не скачивается: rclone serve http,
# ffmpeg берёт только нужные отрезки. Каждый шортс = один или несколько отрезков подряд, склейка без перекодирования звука-щелчков
# (короткий звуковой фейд на стыках). Кладёт «Брокер/Куски/<name> <NN Название>.mp4» — сырой для этапов 1 и 2Н.

on:
  workflow_dispatch:
    inputs:
      src:
        description: "Путь от корня Диска"
        required: true
      name:
        description: "Префикс имени, например Год в Испании"
        required: true
      segs:
        description: 'JSON {"13 Название": [[a, b], ...], ...} — секунды исходника'
        required: true

jobs:
  k:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rclone
        with:
          token: ${{ secrets.RCLONE_TOKEN }}
          client_id: ${{ secrets.RCLONE_CLIENT_ID }}
          client_secret: ${{ secrets.RCLONE_CLIENT_SECRET }}
      - name: Резать
        env:
          SRC: ${{ inputs.src }}
          NAME: ${{ inputs.name }}
          SEGS: ${{ inputs.segs }}
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          sed -e 's/^\[montazh\]/[ves]/' -e '/^root_folder_id/d' ~/.config/rclone/rclone.conf >> ~/.config/rclone/rclone.conf
          nohup rclone serve http "ves:$(dirname "$SRC")" --addr 127.0.0.1:8088 --read-only --buffer-size 64M > serve.log 2>&1 &
          sleep 8
          export U="http://127.0.0.1:8088/$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$(basename "$SRC")")"
          python3 - <<'PY'
          import json, os, subprocess
          U = os.environ['U']; segs = json.loads(os.environ['SEGS']); name = os.environ['NAME']
          for k, ss in segs.items():
              ins, fl = [], ''
              for i, (a, b) in enumerate(ss):
                  ins += ['-ss', f'{a:.3f}', '-to', f'{b:.3f}', '-i', U]
                  d = b - a
                  fl += f'[{i}:v]fps=30,setpts=PTS-STARTPTS[v{i}];[{i}:a]asetpts=PTS-STARTPTS,afade=t=in:d=0.015,afade=t=out:st={d - 0.02:.3f}:d=0.02[a{i}];'
              n = len(ss); fl += ''.join(f'[v{i}][a{i}]' for i in range(n)) + f'concat=n={n}:v=1:a=1[v][a]'
              out = f'{name} {k}.mp4'
              r = subprocess.run(['ffmpeg', '-v', 'error', '-y', *ins, '-filter_complex', fl, '-map', '[v]', '-map', '[a]', '-c:v', 'libx264', '-preset', 'fast',
                                  '-crf', '15', '-pix_fmt', 'yuv420p', '-c:a', 'aac', '-b:a', '192k', '-ar', '48000', '-movflags', '+faststart', out], capture_output=True, text=True)
              if r.returncode: print(f'::error::{k}: {r.stderr[-400:]}'); continue
              du = subprocess.run(['ffprobe', '-v', 'error', '-show_entries', 'format=duration', '-of', 'csv=p=0', out], capture_output=True, text=True).stdout.strip()
              subprocess.run(['rclone', 'copyto', out, f'montazh:Брокер/Куски/{out}'], check=True, stdin=subprocess.DEVNULL)
              os.remove(out); print(f'::notice::{out}: {du} с', flush=True)
          PY
