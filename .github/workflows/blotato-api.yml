name: Blotato — свой запрос (для Claude)

# Для Claude (28.10.2026): python-код (base64) с готовой функцией api(method, path, body=None) к https://backend.blotato.com/v2.
# Ключ берётся с Диска (Общее/Робот/blotato_ключ.txt). Печать кода уходит в заметки. Ничего на Диске не меняет.

on:
  workflow_dispatch:
    inputs:
      code:
        description: "python-код в base64"
        required: true

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rclone
        with:
          token: ${{ secrets.RCLONE_TOKEN }}
          client_id: ${{ secrets.RCLONE_CLIENT_ID }}
          client_secret: ${{ secrets.RCLONE_CLIENT_SECRET }}
      - name: Запрос
        env:
          CODE: ${{ inputs.code }}
        run: |
          rclone copyto "montazh:Общее/Робот/blotato_ключ.txt" key.txt
          cat > pre.py <<'PY'
          import json, urllib.request
          KEY = open('key.txt', encoding='utf-8-sig').read().strip()
          def api(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              r = urllib.request.Request('https://backend.blotato.com/v2' + path, data=data, method=method,
                  headers={'blotato-api-key': KEY, 'accept': 'application/json', 'content-type': 'application/json'})
              with urllib.request.urlopen(r, timeout=60) as resp:
                  b = resp.read(); return resp.status, (json.loads(b) if b else None)
          PY
          echo "$CODE" | base64 -d >> pre.py
          python3 pre.py 2>&1 | head -c 9000 > out.txt || true
          python3 - <<'PY'
          t = open('out.txt', encoding='utf-8', errors='replace').read().replace('%', '%25').replace('\n', '%0A')
          for i in range(0, max(1, len(t)), 2900): print(f"::notice title=вывод [{i//2900+1}]::{t[i:i+2900]}")
          PY
