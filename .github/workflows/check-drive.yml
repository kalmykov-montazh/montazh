name: Проверка доступа к Диску

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/check-drive.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Установить rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Настроить доступ только к папке «Монтаж!»
        env:
          RCLONE_TOKEN: ${{ secrets.RCLONE_TOKEN }}
          CLIENT_ID: ${{ secrets.RCLONE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.RCLONE_CLIENT_SECRET }}
        run: |
          if [ -z "$RCLONE_TOKEN" ]; then echo "::error::Секрет RCLONE_TOKEN не найден"; exit 1; fi
          lines=$(printf '%s' "$RCLONE_TOKEN" | wc -l)
          TOKEN=$(printf '%s' "$RCLONE_TOKEN" | tr -d '\r\n ')
          # rclone с собственным пропуском выдаёт ключ в base64 — раскодировать
          if [ "${TOKEN:0:1}" != "{" ]; then
            dec=$(printf '%s' "$TOKEN" | base64 -d 2>/dev/null || true)
            if printf '%s' "$dec" | jq -e '.token' > /dev/null 2>&1; then
              TOKEN=$(printf '%s' "$dec" | jq -r '.token')
            elif printf '%s' "$dec" | jq -e '.refresh_token' > /dev/null 2>&1; then
              TOKEN=$(printf '%s' "$dec" | jq -c '.')
            fi
          fi
          if printf '%s' "$TOKEN" | jq -e '.refresh_token' > /dev/null 2>&1; then ok=yes; else ok=no; fi
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then echo "::error::Нет секретов пропуска"; exit 1; fi
          echo "::notice::Строк в ключе: $lines, ключ читается: $ok, длина: ${#TOKEN}, пробелов: $(printf '%s' "$TOKEN" | tr -cd ' ' | wc -c), первый символ: ${TOKEN:0:1}, последний: ${TOKEN: -1}, есть refresh_token: $(printf '%s' "$TOKEN" | grep -c refresh_token)"
          mkdir -p ~/.config/rclone
          {
            echo "[montazh]"
            echo "type = drive"
            echo "scope = drive"
            echo "client_id = $(printf '%s' "$CLIENT_ID" | tr -d '\r\n ')"
            echo "client_secret = $(printf '%s' "$CLIENT_SECRET" | tr -d '\r\n ')"
            echo "root_folder_id = 14cRZPujsOPWUQHOqHNu_W1wu1stLaohd"
            echo "token = $TOKEN"
          } > ~/.config/rclone/rclone.conf

      - name: Показать папки внутри «Монтаж!»
        run: |
          if out=$(rclone lsd montazh: 2>&1); then
            echo "::notice::Папки: $(echo "$out" | awk '{print $NF}' | tr '\n' ' ')"
          else
            echo "::error::$(echo "$out" | tail -3 | tr '\n' ' ' | cut -c1-400)"
            exit 1
          fi

      - name: Посчитать файлы в «Сырые!»
        run: |
          echo "::notice::Файлов в Сырые!: $(rclone lsf "montazh:Сырые!" --files-only | wc -l)"

