name: Приёмка — полное прослушивание перед показом Евгению

# 17.11.2026, Евгений: «качественное прослушивание полностью всего ролика, и хука, и всего… чтобы такого никогда не могло быть».
# Слушает КАЖДЫЙ ролик «!!! *.mp4» в указанных папках (две программы, каждое слово отдельными окнами, стыки,
# неудачные дубли: «заново / со слов», фальстарт, лишняя речь, «резиновое» слово, повторы, начало и конец).
# Чистый — остаётся. С замечаниями — папка ролика уезжает в «Брокер/работа/_не прошли проверку» с отчётом.
# Запускать ПЕРЕД любым сообщением Евгению «лежит на проверке» — для роликов из любых задач монтажа.

on:
  workflow_dispatch:
    inputs:
      papki:
        description: "Папки внутри «Монтаж!» через «;» (например «Брокер/На проверке/Склейки»)"
        required: true
      shards:
        description: "На сколько машин делить (до 20)"
        required: false
        default: "10"
      strict:
        description: "1 — с замечаниями в карантин, 0 — только отчёт"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      m: ${{ steps.m.outputs.m }}
    steps:
      - id: m
        run: echo "m=$(python3 -c "print(list(range(int('${{ inputs.shards }}'))))")" >> "$GITHUB_OUTPUT"

  check:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.m) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rclone
        with:
          token: ${{ secrets.RCLONE_TOKEN }}
          client_id: ${{ secrets.RCLONE_CLIENT_ID }}
          client_secret: ${{ secrets.RCLONE_CLIENT_SECRET }}
      - name: Подготовить
        run: |
          getent hosts azure.archive.ubuntu.com >/dev/null || sudo sed -i 's#mirror+file:/etc/apt/apt-mirrors.txt#http://archive.ubuntu.com/ubuntu/#g' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          command -v ffmpeg >/dev/null || timeout 300 sudo apt-get -o Acquire::http::Timeout=20 install -y -qq ffmpeg > /dev/null 2>&1 || true
          pip install -q sherpa-onnx faster-whisper pymorphy3 pymorphy3-dicts-ru numpy
      - name: Слушать
        env:
          PAPKI: ${{ inputs.papki }}
          SH: ${{ matrix.shard }}
          N: ${{ inputs.shards }}
          STRICT: ${{ inputs.strict }}
        run: |
          : > spisok.txt
          IFS=';' read -ra P <<< "$PAPKI"
          for p in "${P[@]}"; do
            p="$(echo "$p" | sed 's/^ *//;s/ *$//')"; [ -z "$p" ] && continue
            rclone lsf -R --files-only --include '!!! *.mp4' "montazh:$p" | grep -v '(основа)' | sed "s#^#$p/#" >> spisok.txt
          done
          echo "::notice::Роликов всего: $(wc -l < spisok.txt)"
          export SVODKA="$PWD/svodka.txt"; : > "$SVODKA"
          TAG=$(date -u +%Y%m%d_%H%M)
          i=0
          while IFS= read -r f; do
            if [ $((i % N)) -eq "$SH" ]; then
              rm -f v.mp4; rclone copyto "montazh:$f" v.mp4 || { echo "::error::не скачался: $f"; i=$((i+1)); continue; }
              d=$(dirname "$f"); key="priemka/$(printf '%s' "$f" | md5sum | cut -c1-12)"
              bash scripts/proverka_stykov_shag.sh v.mp4 "$d" "$key" ""
              echo "::notice::проверен: $f"
              rclone copyto "$SVODKA" "montazh:Брокер/работа/_приёмка/${{ github.run_id }}_$SH.txt" 2>/dev/null
            fi
            i=$((i+1))
          done < spisok.txt
