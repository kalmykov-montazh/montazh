name: Служебное — зашифровать секреты rclone для instagram-bot

# Разовое (10.11.2026): шифрует RCLONE_* открытым ключом репозитория instagram-bot (sealed box).
# Расшифровать может только GitHub для instagram-bot. После переноса файл удаляется.

on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: "открытый ключ instagram-bot (base64)"
        required: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - env:
          PK: ${{ inputs.pubkey }}
          A: ${{ secrets.RCLONE_TOKEN }}
          B: ${{ secrets.RCLONE_CLIENT_ID }}
          C: ${{ secrets.RCLONE_CLIENT_SECRET }}
        run: |
          pip install -q pynacl
          python3 - <<'PY'
          import os, base64
          from nacl import public
          box = public.SealedBox(public.PublicKey(base64.b64decode(os.environ["PK"])))
          for n, k in (("token", "A"), ("client_id", "B"), ("client_secret", "C")):
              v = os.environ[k]
              assert v, n
              print(f"::notice::ENC {n} " + base64.b64encode(box.encrypt(v.encode())).decode())
          PY
