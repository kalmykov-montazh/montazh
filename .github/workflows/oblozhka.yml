name: 3. Переделать только обложку

on:
  workflow_dispatch:
    inputs:
      src:
        description: "Сырой ролик внутри «Монтаж!»"
        required: true
      dest:
        description: "Папка ролика, например Готовые!/Тема номер"
        required: true
      cover:
        description: "Надпись обложки: СТРОКА1|СТРОКА2"
        required: true
      cover_hl:
        description: "Слово на белой плашке"
        required: false
      pos:
        description: "auto, top или chest"
        required: false
        default: auto
      work:
        description: "Ключ работы в «работа/» (пусто — по имени сырого). Нужен, если сырой уже в папке ролика"
        required: false
        default: ""
      frame:
        description: "Кадр: пусто — прежний, auto — выбрать заново, число — эта секунда сырого"
        required: false
        default: ""

jobs:
  cover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          token: ${{ secrets.RCLONE_TOKEN }}
          client_id: ${{ secrets.RCLONE_CLIENT_ID }}
          client_secret: ${{ secrets.RCLONE_CLIENT_SECRET }}
      - name: Обложка
        env:
          SRC: ${{ inputs.src }}
          DEST: ${{ inputs.dest }}
          COVER: ${{ inputs.cover }}
          COVER_HL: ${{ inputs.cover_hl }}
          COVER_POS: ${{ inputs.pos }}
          FRAME: ${{ inputs.frame }}
          WORK: ${{ inputs.work }}
        run: |
          name=$(basename "$SRC"); rel="${SRC#*/}"; stem=$(printf '%s' "${rel%.*}" | sed 's:/: - :g'); [ -n "$WORK" ] && stem="$WORK"
          W="$PWD/work/$stem"; mkdir -p raw "$W"
          rclone copyto "montazh:$SRC" "raw/$name"
          rclone copy "montazh:работа/$stem" "$W" --include asr_cache.json --include face.json --include pick.png
          [ -f "$W/face.json" ] || FACE_ONLY=1 python scripts/montage.py "raw/$name" "$W" > /dev/null
          if [ -n "$FRAME" ]; then rm -f "$W/pick.png"; case "$FRAME" in auto) ;; *) export PICK_T="$FRAME";; esac; fi
          [ -f "$W/pick.png" ] || echo "::notice::$(python scripts/pick_frame.py "raw/$name" "$W/pick.png" | tail -1)"
          out=$(FACE_JSON="$W/face.json" python scripts/cover.py "$W/pick.png" "$COVER" "$COVER_HL" "$W/обложка.jpg" 2)
          echo "::notice::$out"
          rclone copyto "$W/обложка.jpg" "montazh:$DEST/обложка.jpg"
          rclone copy "$W" "montazh:работа/$stem" --include face.json --include pick.png --include кандидаты.jpg
          echo "::notice::Обложка готова: $DEST"
