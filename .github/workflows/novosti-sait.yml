name: Новости на сайт kalmykovgroup.com/novosti

# 13.11.2026, решение Евгения: «делай новости… это основной трафик». Задачи Claude по расписанию пишут новости
# в «Брокер/Посты/Новости утро|день|вечер» и «Длинные» (ночная), робот после выхода переносит в «Опубликовано».
# Здесь каждые 20 минут новые файлы «000 ДД.ММ тема.txt» превращаются в страницы сайта (tools/novosti_build.py),
# убранные Евгением («На удаление») снимаются. Ссылки статей — в «_ссылки_новостей.txt» в корне Моего диска,
# их читает задача ответов на комментарии и ставит ссылку комментарием под новостью.

on:
  schedule:
    - cron: "4,24,44 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: {group: novosti-sait, cancel-in-progress: false}

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rclone
        with:
          token: ${{ secrets.RCLONE_TOKEN }}
          client_id: ${{ secrets.RCLONE_CLIENT_ID }}
          client_secret: ${{ secrets.RCLONE_CLIENT_SECRET }}
      - name: Скачать новости
        run: |
          mkdir -p n
          for d in "Новости утро" "Новости день" "Новости вечер" "Новости ночь" "Длинные"; do
            rclone copy "montazh:Брокер/Посты/$d" n --include "000 *.txt" --max-depth 1 || true
          done
          rclone copy "montazh:Брокер/Посты/Опубликовано" n --include "* 000 *.txt" --max-depth 1 --max-age 10d || true
          rclone lsf -R "montazh:Брокер/На удаление" --include "*000 *.txt" > udal.txt 2>/dev/null || true
          ls n | tail -20
      - name: Собрать страницы
        run: python3 tools/novosti_build.py n udal.txt
      - name: Отправить на сайт
        run: |
          sed -e 's/^\[montazh\]/[ves]/' -e '/^root_folder_id/d' ~/.config/rclone/rclone.conf >> ~/.config/rclone/rclone.conf
          rclone rcat --drive-root-folder-id 0ACQfNt8pejbNUk9PVA "ves:_ссылки_новостей.txt" < _ссылки_новостей.txt || echo "::warning::ссылки не записались"
          git add sait/novosti sait/index.html sait/sitemap.xml
          if git diff --cached --quiet; then echo "::notice::новых новостей нет"; exit 0; fi
          git config user.name "kalmykov-robot"; git config user.email "robot@kalmykovgroup.com"
          git commit -qm "Новости на сайт: $(date -u +%F\ %H:%M)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          echo "::notice::$(git log -1 --stat --format=%s | tail -3 | tr '\n' ' ')"
