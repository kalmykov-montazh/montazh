name: Новости на сайт kalmykovgroup.com/novosti

# 13.11.2026, решение Евгения: «делай новости… это основной трафик». Задачи Claude по расписанию пишут новости
# в «Брокер/Посты/Новости утро|день|вечер» и «Длинные» (ночная), робот после выхода переносит в «Опубликовано».
# Здесь каждые 20 минут новые файлы «000 ДД.ММ тема.txt» превращаются в страницы сайта (tools/novosti_build.py),
# убранные Евгением («На удаление») снимаются. Ссылки статей — в «_ссылки_новостей.txt» в корне Моего диска,
# Дополнение для сайта (подробнее, что делать, источники) — «Брокер/Посты/Новости сайт/ДД.ММ тема.txt» (с 13.11.2026).
# их читает задача ответов на комментарии и ставит ссылку комментарием под новостью.

on:
  schedule:
    - cron: "4,24,44 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: {group: novosti-sait, cancel-in-progress: false}

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rclone
        with:
          token: ${{ secrets.RCLONE_TOKEN }}
          client_id: ${{ secrets.RCLONE_CLIENT_ID }}
          client_secret: ${{ secrets.RCLONE_CLIENT_SECRET }}
      - name: Скачать новости
        run: |
          mkdir -p n
          for d in "Новости утро" "Новости день" "Новости вечер" "Длинные"; do
            rclone copy "montazh:Брокер/Посты/$d" n --include "000 *.txt" --max-depth 1 || true
          done
          rclone copy "montazh:Брокер/Посты/Опубликовано" n --include "* 000 *.txt" --max-depth 1 --max-age 10d || true
          mkdir -p e
          rclone mkdir "montazh:Брокер/Посты/Новости сайт" || true
          rclone copy "montazh:Брокер/Посты/Новости сайт" e --include "*.txt" --max-depth 1 --max-age 12d || true
          # 26.11.2026: украинские версии новостей — их заголовки идут на украинскую главную (tools/novosti_build.py)
          mkdir -p u
          rclone copy "montazh:Брокер/Посты/Новости UA" u --include "*000 *.txt" --max-depth 1 --max-age 12d || true
          rclone copy "montazh:Брокер/Посты/Опубликовано/UA" u --include "*000 *.txt" --max-depth 1 --max-age 12d || true
          rclone lsf -R "montazh:Брокер/На удаление" --include "*000 *.txt" > udal.txt 2>/dev/null || true
          # 17.11.2026: хвост журнала робота — какое фото ушло с каждой новостью в Facebook (то же фото — на сайт и в Telegram)
          rclone cat "montazh:Брокер/К публикации/_задания/журнал.txt" 2>/dev/null | grep "ТЕКСТ " | tail -400 > zhurnal.txt || true
          ls n | tail -20
      - name: Собрать страницы
        run: |
          pip install -q pillow 2>/dev/null || true
          UA_DIR=u python3 tools/novosti_build.py n udal.txt e
      - name: Отправить на сайт
        run: |
          sed -e 's/^\[montazh\]/[ves]/' -e '/^root_folder_id/d' ~/.config/rclone/rclone.conf >> ~/.config/rclone/rclone.conf
          rclone rcat --drive-root-folder-id 0ACQfNt8pejbNUk9PVA "ves:_ссылки_новостей.txt" < _ссылки_новостей.txt || echo "::warning::ссылки не записались"
          git add sait/novosti sait/index.html sait/sitemap.xml
          if git diff --cached --quiet; then echo "::notice::новых новостей нет"; exit 0; fi
          git config user.name "kalmykov-robot"; git config user.email "robot@kalmykovgroup.com"
          git commit -qm "Новости на сайт: $(date -u +%F\ %H:%M)"
          # 23.11.2026: сборка теперь трогает и sait/en, sait/es — без --autostash pull падал «unstaged changes», новости не пушились с 22.11 вечера
          for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && break; sleep 5; done
          echo "::notice::$(git log -1 --stat --format=%s | tail -3 | tr '\n' ' ')"
      - name: Новости в Telegram-канал @ispaniya_zakony
        # 17.11.2026, решение Евгения: в канал идут все новости, что вышли на сайт (обычно 2–3), по воскресеньям вечером — итог недели.
        # Публикует бот @kalmykov_spain_bot через сайт (sait/functions/tg/news-sync.js); ждём, пока Cloudflare выложит свежие новости.
        if: always()
        run: |
          sleep 90
          curl -s --max-time 60 https://kalmykovgroup.com/tg/news-sync || echo "::warning::канал не ответил"
          # 18.11.2026: прогрев людей в боте (через 7 дней после шпаргалки про аренду), sait/functions/tg/drip.js
          curl -s --max-time 60 https://kalmykovgroup.com/tg/drip || echo "::warning::прогрев не ответил"
