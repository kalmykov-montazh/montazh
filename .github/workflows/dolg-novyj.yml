name: 4Н. Шортсы из горизонтального лонга — новый стиль

# 22.10.2026, «17 ловушек аренды». Источник — готовый лонг «Готовые!/<тема>/!!! <тема>.mp4».
# mode=razbor: распознать весь лонг, кадры каждые 5 с, тишины -> работа/Лонг <тема>/ + зашифрованно в ветку tmp-pics.
# mode=render: shorts из dolg/<тема>/NN.json (куски, раскладка, плашки, обложка) -> Готовые!/ШОРТС <тема>/NN Название.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "razbor или render"
        required: true
        default: razbor
      topic:
        description: "Тема лонга (папка в Готовые!), например 17 ловушек аренды"
        required: true
      ids:
        description: "render: номера шортсов через пробел (пусто — все)"
        required: false
        default: ""
      key:
        description: "Пароль для шифрования (razbor, превью)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  razbor:
    if: inputs.mode == 'razbor'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          token: ${{ secrets.RCLONE_TOKEN }}
          client_id: ${{ secrets.RCLONE_CLIENT_ID }}
          client_secret: ${{ secrets.RCLONE_CLIENT_SECRET }}
      - name: Скачать лонг
        env:
          TOPIC: ${{ inputs.topic }}
        run: |
          rclone copyto "montazh:Готовые!/$TOPIC/!!! $TOPIC.mp4" long.mp4
          echo "::notice::$(du -h long.mp4 | cut -f1), $(ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate -of compact=p=0 long.mp4 | tr '\n' ' ')"
      - name: Разбор
        run: python scripts/dolg/razbor.py long.mp4 "$WMODEL" out | tail -3
      - name: На Диск и в ветку
        env:
          TOPIC: ${{ inputs.topic }}
          KEY: ${{ inputs.key }}
        run: |
          echo "::add-mask::$KEY"
          rclone copy out "montazh:работа/Лонг $TOPIC" --include asr.json --include text.txt --include silence.txt
          tar czf p.tgz -C out asr.json text.txt silence.txt $(cd out; ls sheet_*.jpg)
          openssl enc -aes-256-cbc -pbkdf2 -salt -in p.tgz -out /tmp/p.enc -pass env:KEY
          git config user.name montazh; git config user.email montazh@users.noreply.github.com
          git checkout --orphan tmp-pics; git rm -rqf .
          cp /tmp/p.enc p.enc; git add p.enc; git commit -qm "tmp [skip ci]"; git push -fq origin tmp-pics
