name: Фото для вставок

# Для Claude (06.10.2026): переносит фото из «Сырые!» в папку ролика (подпапка «фото»),
# поворачивает по EXIF (телефонные снимки), отдаёт уменьшенные копии зашифрованным архивом в ветку tmp-pics.

on:
  workflow_dispatch:
    inputs:
      files:
        description: "Фото внутри «Сырые!» через ;"
        required: true
      dest:
        description: "Папка ролика, например Готовые!/НОВ Тема — фото лягут в <dest>/фото"
        required: true
      key:
        description: "Пароль для шифрования"
        required: true

permissions:
  contents: write

jobs:
  foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rclone
        with:
          token: ${{ secrets.RCLONE_TOKEN }}
          client_id: ${{ secrets.RCLONE_CLIENT_ID }}
          client_secret: ${{ secrets.RCLONE_CLIENT_SECRET }}
      - name: Повернуть и перенести
        env:
          FILES: ${{ inputs.files }}
          DEST: ${{ inputs.dest }}
        run: |
          pip install -q pillow
          mkdir -p src rot out
          IFS=';' read -ra fs <<< "$FILES"
          for f in "${fs[@]}"; do rclone copyto "montazh:Сырые!/$f" "src/$f"; done
          python3 - <<'PY'
          import glob, os
          from PIL import Image, ImageOps
          for f in sorted(glob.glob('src/*')):
              n = os.path.basename(f)
              im = ImageOps.exif_transpose(Image.open(f)).convert('RGB')
              im.save(f'rot/{n}', quality=95)
              t = im.copy(); t.thumbnail((700, 700))
              t.save(f'out/{os.path.splitext(n)[0]} {im.width}x{im.height}.jpg', quality=80)
          PY
          rclone copy rot "montazh:$DEST/фото"
          for f in "${fs[@]}"; do
            if rclone lsf "montazh:$DEST/фото/$f" | grep -q .; then rclone deletefile "montazh:Сырые!/$f"; fi
          done
          echo "::notice::Фото: $(ls rot | wc -l) → $DEST/фото"
      - name: Зашифровать и положить в ветку tmp-pics
        env:
          KEY: ${{ inputs.key }}
        run: |
          echo "::add-mask::$KEY"
          tar czf p.tgz -C out .
          openssl enc -aes-256-cbc -pbkdf2 -salt -in p.tgz -out /tmp/p.enc -pass env:KEY
          git config user.name montazh; git config user.email montazh@users.noreply.github.com
          git checkout --orphan tmp-pics; git rm -rqf .
          cp /tmp/p.enc p.enc; git add p.enc; git commit -qm "tmp [skip ci]"; git push -fq origin tmp-pics
