name: Показать текстовый файл с Диска

# Для Claude: логи задач ему не видны, поэтому текст выводится заметками (по 3000 знаков).

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Путь внутри «Монтаж!», можно несколько через ;"
        required: true

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rclone
        with:
          token: ${{ secrets.RCLONE_TOKEN }}
          client_id: ${{ secrets.RCLONE_CLIENT_ID }}
          client_secret: ${{ secrets.RCLONE_CLIENT_SECRET }}
      - name: Показать
        env:
          P: ${{ inputs.path }}
        run: |
          IFS=';' read -ra paths <<< "$P"
          for p in "${paths[@]}"; do
            if ! rclone cat "montazh:$p" > f.txt 2> err.txt; then echo "::error::Не прочитать: $p: $(tail -2 err.txt | tr "\n" " ")"; continue; fi
            python3 - "$p" <<'PY'
          import sys
          t = open('f.txt', encoding='utf-8', errors='replace').read().replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          # куски по байтам (кириллица = 2 байта), иначе GitHub обрезает заметку (06.10.2026)
          parts, cur = [], ''
          for ch in t:
              if len((cur + ch).encode()) > 3800: parts.append(cur); cur = ''
              cur += ch
          parts.append(cur)
          for n, c in enumerate(parts, 1):
              print(f"::notice title={sys.argv[1]} [{n}]::{c}")
          PY
          done
