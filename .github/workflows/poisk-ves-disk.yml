name: Поиск больших видео по всему Диску и в корзине

# Для Claude (28.10.2026, просьба Евгения найти исходники лонгов): только чтение, список больших видео
# по всему Google Диску (не только «Монтаж!») и отдельно в корзине.

on:
  workflow_dispatch:
    inputs:
      min_size:
        description: "Минимальный размер, например 300M"
        required: false
        default: "300M"

jobs:
  find:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rclone
        with:
          token: ${{ secrets.RCLONE_TOKEN }}
          client_id: ${{ secrets.RCLONE_CLIENT_ID }}
          client_secret: ${{ secrets.RCLONE_CLIENT_SECRET }}
      - name: Искать
        env:
          MS: ${{ inputs.min_size }}
        run: |
          sed -e 's/^\[montazh\]/[ves]/' -e '/^root_folder_id/d' ~/.config/rclone/rclone.conf >> ~/.config/rclone/rclone.conf
          inc=(--include "*.mp4" --include "*.MP4" --include "*.mov" --include "*.MOV" --include "*.mkv")
          { echo "=== КОРЗИНА"; rclone lsf "ves:" -R --files-only --drive-trashed-only --min-size "$MS" --format "stp" --separator ' | ' "${inc[@]}" 2>&1 | sort -r | head -150
            echo "=== ВЕСЬ ДИСК"; rclone lsf "ves:" -R --files-only --min-size "$MS" --format "stp" --separator ' | ' "${inc[@]}" 2>&1 | grep -v "^.*| Монтаж!/" | sort -r | head -250; } > f.txt
          python3 - <<'PY'
          t = open('f.txt', encoding='utf-8', errors='replace').read().replace('%', '%25').replace('\n', '%0A')
          for i in range(0, min(len(t), 30000), 3000): print(f"::notice title=[{i // 3000 + 1}]::{t[i:i + 3000]}")
          PY
