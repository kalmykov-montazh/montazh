name: 3Н. Обложка нового стиля из кадра готового видео

# Для Claude (22.10.2026): кадр из файла в папке ролика → scripts/cover_new.py → обложка.jpg в ту же папку.

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Папка ролика"
        required: true
      src:
        description: "Файл в папке, из которого брать кадр"
        required: true
      t:
        description: "Секунда кадра"
        required: true
      style:
        description: "Стиль 1–7 или название"
        required: true
      top:
        description: "ВЕРХ|…"
        required: false
        default: ""
      bot:
        description: "НИЗ|…"
        required: true
      shift:
        description: "Сдвинуть кадр вниз на столько пикселей (сверху — размытое продолжение), чтобы вшитые субтитры ушли под полосу обложки"
        required: false
        default: ""
      clean:
        description: "y1:y2 — стереть вшитые старые субтитры в этой полосе кадра (inpaint), пусто — не трогать"
        required: false
        default: ""

jobs:
  cover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare
        with:
          token: ${{ secrets.RCLONE_TOKEN }}
          client_id: ${{ secrets.RCLONE_CLIENT_ID }}
          client_secret: ${{ secrets.RCLONE_CLIENT_SECRET }}
      - name: Обложка
        env:
          F: ${{ inputs.folder }}
          SRC: ${{ inputs.src }}
          T: ${{ inputs.t }}
          ST: ${{ inputs.style }}
          TOP: ${{ inputs.top }}
          BOT: ${{ inputs.bot }}
          CLEAN: ${{ inputs.clean }}
          SHIFT: ${{ inputs.shift }}
        run: |
          rclone copyto "montazh:$F/$SRC" v.mp4
          ffmpeg -v error -y -ss "$T" -i v.mp4 -frames:v 1 pick.png
          if [ -n "$SHIFT" ]; then
            ffmpeg -v error -y -i pick.png -filter_complex "[0]split[x][y];[x]crop=1080:$SHIFT:0:0,vflip,boxblur=12[t];[y]crop=1080:1920-$SHIFT:0:0[m];[t][m]vstack" p2.png && mv p2.png pick.png
          fi
          if [ -n "$CLEAN" ]; then python - <<'PY'
          import cv2, numpy as np, os
          y1, y2 = map(int, os.environ['CLEAN'].split(':'))
          im = cv2.imread('pick.png'); b = im[y1:y2]
          hsv = cv2.cvtColor(b, cv2.COLOR_BGR2HSV)
          dark = (b.max(axis=2) < 70)                                     # чёрная обводка букв
          yel = (hsv[..., 0] > 15) & (hsv[..., 0] < 40) & (hsv[..., 1] > 120) & (hsv[..., 2] > 150)
          m = (dark | yel).astype(np.uint8) * 255
          core = (dark | yel).astype(np.uint8)
          core[:, :150] = 0; core[:, 930:] = 0
          near = cv2.dilate(core, np.ones((25, 25), np.uint8)) > 0
          white = b.min(axis=2) > 120
          m = (near & (dark | yel | white)).astype(np.uint8)
          m = cv2.dilate(cv2.morphologyEx(m, cv2.MORPH_CLOSE, np.ones((11, 11), np.uint8)), np.ones((9, 9), np.uint8)) * 255
          mask = np.zeros(im.shape[:2], np.uint8); mask[y1:y2] = m
          cv2.imwrite('pick.png', cv2.inpaint(im, mask, 9, cv2.INPAINT_NS))
          print(f"::notice::Стёрто субтитров: {int((mask > 0).sum())} точек")
          PY
          fi
          python scripts/cover_new.py pick.png "$ST" "$TOP" "$BOT" обложка.jpg
          rclone copyto обложка.jpg "montazh:$F/обложка.jpg"
          echo "::notice::Обложка: $F, стиль $ST, кадр $T с"
